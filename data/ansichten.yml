- id: hauptfenster
  titel: Hauptfenster
  beschreibung: Alles auf einen Blick. Ein Klick auf die Punkte zeigt die Erklärung.
  bild: hauptfenster-audiokette.webp
  breite: 2400
  hoehe: 1504
  alt: Hauptfenster von xSDR64 mit Audiokette, Spektrum, Wasserfall und Seitenleisten
  hotspots:
    - gruppe: "Kopfleiste"
      x: 5.5
      y: 4.7
      titel: "Lautstärke und Kopfhörer"
      text: "Zwei Regler: Lautstärke des Lautsprechers und des Kopfhörers am Radio."
    - gruppe: "Kopfleiste"
      x: 18.1
      y: 4.7
      titel: "Zahnrad: Audio-Einstellungen"
      text: "Audio-Einstellungen der App, zum Beispiel das Mikrofon vom Flex als Eingang der Audiokette."
    - gruppe: "Kopfleiste"
      x: 20.3
      y: 4.7
      titel: "Aufnahme"
      text: "Roter Punkt: Aufnahme starten. Zur Wahl stehen die Audiokette, der Empfang im Radio und die echte Aussendung über einen zweiten Slice. Die Aufnahmezeit läuft als Uhr mit."
    - gruppe: "Kopfleiste"
      x: 22.8
      y: 4.7
      titel: "Wiedergabe"
      text: "Spielt die letzte Aufnahme im Radio ab. Rechtsklick: automatisch senden (MOX). Nur an der Blindlast testen."
    - gruppe: "Kopfleiste"
      x: 27.2
      y: 4.7
      titel: "Statuslampen"
      text: "Weiß: nicht aktiv. Grün: in Ordnung. Gelb: Abweichung oder Standby. Rot: kritisch."
    - gruppe: "Kopfleiste"
      x: 32.5
      y: 4.7
      titel: "ACOM-Endstufe"
      text: "Blitz mit Lampe: Zustand der ACOM-Endstufe. Ein Klick schaltet zwischen Ein, Operate, Standby und Aus (über die Zusatz-App xAcom64)."
    - gruppe: "Kopfleiste"
      x: 53.8
      y: 4.7
      titel: "Frequenz und Betriebsart"
      text: "Buchstabe des aktiven Slice, seine Frequenz, die Betriebsart und das Band."
    - gruppe: "Kopfleiste"
      x: 80.5
      y: 4.7
      titel: "Global-Profil"
      text: "Auswahl des Global-Profils des Radios. Pro Band gibt es ein Profil, das alle Einstellungen des Bandes lädt. Das grüne Symbol daneben speichert das Profil."
    - gruppe: "Kopfleiste"
      x: 91.5
      y: 4.7
      titel: "Audio: Radio oder Mac"
      text: "Radio: der Ton kommt aus dem Ausgang des Radios. Mac: der Ton kommt übers Netz auf den Mac."
    - gruppe: "Kopfleiste"
      x: 97.4
      y: 4.7
      titel: "Trennen"
      text: "Trennt die Verbindung zum Radio. Die Taste wird rot, wenn die Maus darüber steht."
    - gruppe: "Audiokette"
      x: 11.5
      y: 8.5
      titel: "Settings, Kette, Stop"
      text: "Settings öffnet die Einstellungen der Audiokette, „+ Kette“ legt eine weitere Kette an, „Stop“ hält die Verarbeitung an."
    - gruppe: "Audiokette"
      x: 11.5
      y: 16.0
      titel: "Eingang der Kette"
      text: "IN: das Gerät, von dem die Kette ihr Mikrofonsignal bekommt, hier ein RME-Interface. Der Stift links vom Zahnrad benennt den Eintrag um, das Zahnrad wählt Gerät und Kanäle."
    - gruppe: "Audiokette"
      x: 11.5
      y: 25.5
      titel: "Plugins in der Kette"
      text: "Jede Zeile ist ein Plugin. Das Signal läuft von oben nach unten durch EQ, Kompressor, Verstärkung und Limiter. Die Zahl zeigt den Pegel in dB, der blaue Schalter schaltet das Plugin ein oder aus, das Zahnrad öffnet seine Einstellungen und das Kreuz entfernt es."
    - gruppe: "Audiokette"
      x: 11.5
      y: 44.9
      titel: "Ausgang der Kette"
      text: "OUT: das Gerät, an das die Kette ihr bearbeitetes Signal schickt. M und S schalten zwischen Mono und Stereo um, der Lautsprecher schaltet den Ausgang stumm."
    - gruppe: "Audiokette"
      x: 11.5
      y: 85.8
      titel: "Playback"
      text: "Aufnahmen der Audiokette anhören: abspielen, in einer Schleife wiederholen oder zum Radio schicken. „Letzte Aufnahme anhören“ spielt die neueste Aufnahme am Mac ab. Zum Flex schicken nur an der Blindlast testen."
    - gruppe: "Seitenleiste links"
      x: 25.7
      y: 11.0
      titel: "+RX, +Split, +TNF"
      text: "Neuen Slice anlegen, Split einrichten, neuen TNF (Tracking Notch Filter) setzen."
    - gruppe: "Seitenleiste links"
      x: 25.7
      y: 31.4
      titel: "Memory-Liste"
      text: "Ein Klick ruft ein Memory ab. Liegt es auf einem anderen Band, lädt xSDR64 vorher das Global-Profil dieses Bandes."
    - gruppe: "Spektrum"
      x: 59.5
      y: 18.8
      titel: "Slice-Flagge"
      text: "Kleine Flagge an der Frequenz des Slice mit Frequenz, S-Meter und den Schaltern NB, NR, ANF, DSP, DAX, RIT, TX, Split und weiteren."
    - gruppe: "Spektrum"
      x: 59.5
      y: 26.5
      titel: "Marken und Spots"
      text: "Memories und DX-Spots erscheinen als Schilder über dem Spektrum. Ein Klick auf ein Schild stimmt auf Frequenz, Betriebsart und Filter ab."
    - gruppe: "Spektrum"
      x: 52.5
      y: 44.7
      titel: "Abstimmen"
      text: "Ein Klick auf das Spektrum stimmt den Slice auf diese Stelle ab. Mausrad oder Trackpad stimmen schrittweise ab, Ziehen verschiebt die Anzeige."
    - gruppe: "Spektrum"
      x: 70.8
      y: 33.5
      titel: "Slice-Linie und Filter"
      text: "Die gelbe Linie ist die Frequenz des Slice, die hellere Fläche daneben der Filter. Die Kanten lassen sich mit der Maus ziehen."
    - gruppe: "Spektrum"
      x: 54.5
      y: 71.2
      titel: "Bandplan"
      text: "Der farbige Streifen über der Frequenzleiste zeigt den Bandplan (hier „ALL MODES“). Mit der Maus darüber erscheint eine Erklärung zum Abschnitt."
    - gruppe: "Spektrum"
      x: 62.0
      y: 73.0
      titel: "Frequenzleiste"
      text: "Die Frequenzskala. Auf der Leiste nach links oder rechts ziehen ändert den Zoom."
    - gruppe: "Spektrum"
      x: 80.5
      y: 72.9
      titel: "LIVE"
      text: "Zeigt, dass der Wasserfall live läuft. Im Streifen rechts am Wasserfall ziehen spult zurück, ein Klick auf LIVE kehrt zur Live-Anzeige zurück."
    - gruppe: "Spektrum"
      x: 54.5
      y: 85.4
      titel: "Wasserfall"
      text: "Zeigt über der Zeit, was auf dem Band los ist. Links stehen die Zeitmarken (−5 s, −10 s …)."
    - gruppe: "Rechte Seitenleiste"
      x: 91.5
      y: 8.0
      titel: "Blöcke wählen"
      text: "TX, MIC, PHNE, RX und xTUNE blenden die jeweiligen Blöcke ein oder aus."
    - gruppe: "Rechte Seitenleiste"
      x: 86.0
      y: 11.1
      titel: "TX"
      text: "Sendeleistung und SWR, TX-Profil, RF Power, Tune Power sowie die Tasten TUNE, MOX und ATU."
    - gruppe: "Rechte Seitenleiste"
      x: 86.0
      y: 33.9
      titel: "MIC"
      text: "Mikrofonpegel und Kompression, Mic-Profil, Eingang, Mithören (MON) und die Taste „Audiokette“."
    - gruppe: "Rechte Seitenleiste"
      x: 86.0
      y: 56.7
      titel: "RX"
      text: "Slice, Antenne, Betriebsart, Frequenz, Abstimmschritt, Lock, Lautstärke, Balance, Squelch, AGC mit AUTO und KAL, NB, NR, ANF und der DAX-Kanal."
    - gruppe: "Rechte Seitenleiste"
      x: 90.5
      y: 75.5
      titel: "AGC-T: AUTO und KAL"
      text: "AUTO führt die AGC-Schwelle dem Rauschen nach, je Band. KAL misst das Rauschen einmal aus und stellt die Schwelle auf den Zielpegel. Dafür eine ruhige Stelle ohne Signal wählen."
    - gruppe: "Rechte Seitenleiste"
      x: 91.5
      y: 87.8
      titel: "Filter"
      text: "Das blaue Bild zeigt Breite und Kanten des Filters. Mit den Tasten darunter wechselst du die Breite. Bei SSB bleibt die untere Kante stehen, bei AM und FM wächst der Filter nach beiden Seiten."
    - gruppe: "Statuszeile"
      x: 5.5
      y: 98.5
      titel: "TNF, DVK, FDX"
      text: "Schalter für TNFs, den DVK-Speicher und Full Duplex."
    - gruppe: "Statuszeile"
      x: 47.0
      y: 98.5
      titel: "Radio-Anzeige"
      text: "Name des Radios, Firmware, Station, RC-28-Lampe und Netzqualität."
    - gruppe: "Statuszeile"
      x: 92.5
      y: 98.5
      titel: "Sendebereitschaft"
      text: "TX Ready, Versorgungsspannung, Temperatur und Uhrzeit (UTC)."
